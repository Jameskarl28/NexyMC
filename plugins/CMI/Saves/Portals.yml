# Command section can utilize same custom variables as scheduler. Check Schedules.yml file for all possible variables.

spawn:
  rtp:
    Loc: -6.0:73.0:47.0:6.0:80.0:59.0
    enabled: true
    effect: CherryLeaves
    showParticles: true
    kickBack: true
    particlesByPermission: false
    requiresPerm: false
    informOnMissingPerm: false
    particleAmount: 30
    particleHide: 0
    activationRange: 16
    commandsWithoutTp: true
    commands:
    - betterrtp player %player_name% world IGNORECOOLDOWN NOCOOLDOWN NODELAY
    - cmi effect [playerName] blindness 2 10 -s
