strings:
  none: None
  status: 'Players online: %discordbridge_server_total_players_online% | Link your
    Discord account by executing: /account link'
  help:
    command:
      admin:
        config:
          set:
            description: Set config values.
      lands:
        inbox:
          description: View the inbox of your land.
        top:
          description: View top lands.
        channel:
          create:
            description: Create a land chat channel.
            args:
              land: Name of the land
          delete:
            description: Delete the land chat channel.
      nations:
        inbox:
          description: View the inbox of your nation.
        top:
          description: View top nations.
        channel:
          create:
            description: Create a nation chat channel.
            args:
              nation: Name of the nation
          delete:
            description: Delete the nation chat channel.
      account:
        link:
          description: Link your Discord and Minecraft account.
          args:
            code: The verification code you got for executing {cmd} ingame.
        unlink:
          description: Unlink your Discord account from an Minecraft account.
      ticket:
        assign:
          description: Assign support member to the current ticket.
          args:
            member: The support member that you want to assign.
        add:
          description: Add member to the current ticket.
          args:
            member: The member that you want to add.
      online:
        description: View all players that are online at the Minecraft server.
  channel:
    land: Use **/lands chat [land] <message>** ingame to chat with your land members
      on Discord. With **/lands inbox** in this Discord server, you can see the inbox
      of your land in this channel.
    nation: Use **/nations chat [nation] <message>** ingame to chat with your nation
      members on Discord. With **/nations inbox** in this Discord server, you can
      see the inbox of your nation in this channel.
  inbox:
    title: Inbox
  top:
    title: 'Top: {sorting}'
  ticket:
    actions:
      close: Close
      open: Open
      assign: Assign
      delete: Delete
      info: Request Info
  modal:
    ticket:
      action:
        state:
          title: Change Ticket State
          fields:
            default:
              placeholder: Select a pre-defined reason.
            reason:
              label: Reason
              placeholder: Please explain why you chose this action.
        info:
          title: Request Information
          fields:
            default:
              placeholder: Select a pre-defined information.
            info:
              label: Information
              placeholder: Request information.
      create:
        title: Open Ticket
        types:
          support:
            name: Support Request
            description: If you want to ask questions etc. Anything that isn't related
              to bugs.
            fields:
              request:
                label: Description
                placeholder: Please describe your concern as clearly as possible.
          bugreport:
            name: Bugreport
            description: If you found and bug and want to report it.
            fields:
              behaviour:
                expected:
                  label: Expected Behaviour
                  placeholder: Describe which behaviour you expected.
                observed:
                  label: Observed Behaviour
                  placeholder: Describe which behaviour you observed.
              reproduction:
                label: Reproduction Steps
                placeholder: List required steps to reproduce.
              other:
                label: Other Information
                placeholder: List other information that you think might be helpful.
  lands:
    broadcast:
      category:
        land_created: Land Created
        land_deleted: Land Deleted
        relation_changed: Relationship Changed
        war_state_changed: War Update
        upkeep_collected: Upkeep Collected
        upkeep_reminder: Upkeep Reminder
lands:
  command:
    general:
      chat-channel: This command needs to be executed in a chat channel.
      not-exist: A land or nation with the name **{object}** doesn't exist. Typo?
    inbox:
      alert:
        content: '@here'
        embeds:
          one:
            description: '{symbol} {message}'
            color: '#ff0000'
      normal:
        embeds:
          one:
            description: '{symbol} {message}'
    channel:
      owner: Only the owner **{player}** of **{object}** can do this. Your linked
        ingame player **{player}** isn't the owner.
      create:
        already: 'You already created a channel for {object} (channel: {channel}).'
        max: This server reached the maximum amount of **{max}** channels. This can
          be edited in config.
        success: 'Successfully created channel(s) for {object}: **{channel}**'
      delete:
        success: Successfully deleted the channel(s) of {object}.
config:
  command:
    set:
      invalid: 'The provided value is invalid: {error}'
      unset: Successfully removed the value of **{key}**.
      success: Successfully updated value **{key}** to ``{value}``.
online:
  command:
    embeds:
      one:
        title: Online Players
        description: There are currently {players} players online on the network.
        fields:
          one:
            name: '{server} ({server_players_amount})'
            value: '{server_players}'
general:
  command:
    no-permission: You're not allowed to do that.
  message:
    insufficient-perms: 'Please contact your server admin. The ticket bot is missing
      the following permission: **{permission}**'
events:
  server:
    started:
      embeds:
        one:
          title: '{server} is now online.'
          color: '#00c434'
    stopping:
      embeds:
        one:
          title: '{server} is now offline.'
          color: '#c4001d'
  player:
    join:
      first:
        embeds:
          one:
            title: '{player} joined server for the first time.'
            color: '#00c434'
      normal:
        embeds:
          one:
            title: '{player} logged into server.'
            color: '#00c434'
    quit:
      embeds:
        one:
          title: '{player} left the server.'
          color: '#c4001d'
    death:
      embeds:
        one:
          title: '{player} died'
          description: '{message}'
    advancement:
      embeds:
        one:
          title: Advancement of {player}
          fields:
            one:
              name: '{title}'
              value: '{description}'
    playtime:
      embeds:
        one:
          title: Playtime
          description: '{player} has reached **{time}** of playtime on server {server}.'
account:
  command:
    general:
      not-linked:
        embeds:
          one:
            title: Discord and Ingame Account not linked
            description: You haven't linked your Discord account with your Minecraft
              account yet.
            fields:
              one:
                name: Link your Account
                value: Execute **/{cmd}** ingame to link your account.
            color: '#ff0000'
    link:
      already:
        embeds:
          one:
            title: Already linked
            description: Your account is already linked to a Minecraft Account.
            fields:
              one:
                name: Minecraft Account
                value: '{player}'
              two:
                name: Unlink
                value: You can unlink it by executing ``/{cmd}`` in this Discord server.
            color: '#ff0000'
      roles: 'You''re not allowed to link your account. Only members with at least
        one of these roles are allowed to link their account: {roles}'
      code: 'Your code is invalid. Execute the command again in-game to retrieve a
        new code: ``/{cmd}``'
      success: Successfully linked your Discord account to the Minecraft account **{player}**.
    unlink:
      already: Your Discord account isn't linked to any Minecraft account.
      success: Successfully unlinked your Discord account from the Minecraft account
        **{player}**.
ticket:
  command:
    create:
      max: You can't create another ticket, since you can only have a maximum of **{max}**
        active tickets.
    general:
      no-ticket: This channel doesn't belong to a ticket.
    assign:
      support: The member must have the role {role}.
      success: Successfully assigned {member} to this ticket.
  message:
    creation:
      embeds:
        one:
          title: Open Ticket
          description: Click the selection menu below to open a ticket.
    opened: 'Successfully opened a ticket for you: {ticket}'
    summary:
      embeds:
        one:
          title: Ticket Summary
          fields:
            one:
              name: Type
              value: '{type}'
              inline: true
            two:
              name: Assigned
              value: '{assigned}'
              inline: true
          footer: You can add members to this ticket by simply mentioning them.
    state:
      already: The ticket already has this state.
      closed:
        embeds:
          one:
            title: Ticket Closed
            description: The ticket has been closed.
            fields:
              one:
                name: Reason
                value: '{reason}'
              two:
                name: Action taken by
                value: '{user}'
      open:
        embeds:
          one:
            title: Ticked Re-Opened
            fields:
              one:
                name: Reason
                value: '{reason}'
              two:
                name: Action taken by
                value: '{user}'
    info-request:
      embeds:
        one:
          title: Missing Information
          description: Some more information is required.
          fields:
            one:
              name: Requested Information
              value: '{info}'
            two:
              name: Requested by
              value: '{user}'
    reminder:
      content: '{submitter}'
      embeds:
        one:
          title: Please Respond
          description: The support staff is awaiting a reply from you.
          fields:
            one:
              name: Your issue is solved?
              value: If your issue is solved, you can close the ticket.
