general:
  previous: previous
  wYes: '&aYes'
  wNo: '&cNo'
  disabled: '&cDisabled'
  enabled: '&aEnabled'
  value:
    none: '&cNone'
    unlimited: '&aunlimited'

common:
  items:
    default:
      child_failure_page_previous:
        name: '&4&lNo Previous Page'
      child_failure_page_next:
        name: '&4&lNo Next Page'
      refresh_page_previous:
        lore:
        - '&8✖ &7Go to the previous page:&3 {previous}'
        name: '&c&lPrevious Page'
        material: ARROW
        slots: 38
      back:
        lore:
        - '&8✖ &7Go back to'
        - '   &7{back}.'
        name: '&c&lBack'
        material: RED_STAINED_GLASS_PANE
        slots: 37
      refresh_page_next:
        lore:
        - '&8✖ &7Go to the next page:&3 {next}'
        name: '&a&lNext Page'
        material: ARROW
        slots: 44
      placeholder_1:
        material: GRAY_STAINED_GLASS_PANE
        slots: 1-45
  size: 45
  entries: 10-36

gui:
  player_linking:
    title: Discord Link
    items:
      default:
        link:
          name: '&9&lLink Discord Account'
          lore:
          - '&8✖ &7Click to link your account.'
          slots: 23
          material: INHERIT
        linked:
          name: '&a&lAccount Linked'
          lore:
          - '&7Account is linked to {user}.'
          - '&8✖ &7Click to unlink.'
          slots: 23
          material: INHERIT
common_sounds:
  # Play a sound when the item is set in the menu.
  set:
    # Each item starting with [item_type]_failure_<name> will have this sound set.
    # You can still override the "sound_set" for any item in their sections.
    failure: minecraft:entity.villager.no
