RewardSortMode:
  WEIGHT: Weight
  RARITY: Rarity
  CHANCE: Chance
  NAME: Name
  ITEM: Item
Command:
  Argument:
    Name:
      Crate: crate
      Key: key
      X: x
      Y: y
      Z: z
  Editor:
    Desc: Open editor GUI.
  Drop:
    Desc: Spawn crate item in the world.
    Done: <#ADD8E6>Dropped <#FFC0CB>%crate_name%</#FFC0CB> at <#FFC0CB>%location_x%, %location_y%, %location_z%</#FFC0CB> in <#FFC0CB>%location_world%</#FFC0CB>.</#ADD8E6>
  DropKey:
    Desc: Spawn key item in the world.
    Done: <#ADD8E6>Dropped <#FFC0CB>%key_name%</#FFC0CB> at <#FFC0CB>%location_x%, %location_y%, %location_z%</#FFC0CB> in <#FFC0CB>%location_world%</#FFC0CB>.</#ADD8E6>
  Open:
    Desc: Open a crate.
  OpenFor:
    Desc: Open crate for a player.
    Done: <#ADD8E6>Opened <#FFC0CB>%crate_name%</#FFC0CB> for <#FFC0CB>%player_name%</#FFC0CB>.</#ADD8E6>
    Notify: <#ADD8E6>You have been forced to open <#FFC0CB>%crate_name%</#FFC0CB>.</#ADD8E6>
  Give:
    Desc: Gives crate to a player.
    Done: <#ADD8E6>Given <#FFC0CB>x%amount%</#FFC0CB> of <#FFC0CB>%crate_name%</#FFC0CB> crate(s) to <#FFC0CB>%player_name%</#FFC0CB>.</#ADD8E6>
    Notify: <#ADD8E6>You recieved <#FFC0CB>x%amount%</#FFC0CB> of <#FFC0CB>%crate_name%</#FFC0CB>.</#ADD8E6>
  Key:
    Desc: Manage player's keys.
    Give:
      Desc: Give key to a player.
      Done: <#ADD8E6>Given <#FFC0CB>x%amount%</#FFC0CB> of <#FFC0CB>%key_name%</#FFC0CB> key(s) to <#FFC0CB>%player_name%</#FFC0CB>.</#ADD8E6>
      Notify: <#ADD8E6>You recieved <#FFC0CB>x%amount%</#FFC0CB> of <#FFC0CB>%key_name%</#FFC0CB>!</#ADD8E6>
    Take:
      Desc: Take key from a player.
      Done: <#ADD8E6>Taken <#FFC0CB>x%amount%</#FFC0CB> of <#FFC0CB>%key_name%</#FFC0CB> key(s) from <#FFC0CB>%player_name%</#FFC0CB>.</#ADD8E6>
      Notify: <#ADD8E6>You lost <lred>x%amount%</lred> <lred>%key_name%</lred>.</#ADD8E6>
    Set:
      Desc: Set keys amount for a player.
      Done: <#ADD8E6>Set <#FFC0CB>x%amount%</#FFC0CB> of <#FFC0CB>%key_name%</#FFC0CB> key(s) for <#FFC0CB>%player_name%</#FFC0CB>.</#ADD8E6>
      Notify: <#ADD8E6>Your <#FFC0CB>%key_name%</#FFC0CB>'s amount has been changed to <#FFC0CB>x%amount%</#FFC0CB>.</#ADD8E6>
    Show:
      Desc: Inspect [player's] virtual keys.
      Format:
        List:
        - <noprefix>
        - ' '
        - '<#FFC0CB><b>%player_name%''s Virtual Keys: </b></#FFC0CB>'
        - '%entry%'
        - ' '
        Entry: '<#FFC0CB>▪ <#ADD8E6>%key_name%: </#ADD8E6>x%amount%</#FFC0CB>'
    GiveAll:
      Desc: Give key to all online players.
      Done: <#ADD8E6>Given <#FFC0CB>x%amount%</#FFC0CB> of <#FFC0CB>%key_name%</#FFC0CB> key(s) to <#FFC0CB>All Players</#FFC0CB>.</#ADD8E6>
  Preview:
    Desc: Open crate preview.
    Done:
      Others: <#ADD8E6>Opened <#FFC0CB>%crate_name%</#FFC0CB> preview for <#FFC0CB>%player_display_name%</#FFC0CB>.</#ADD8E6>
  ResetCooldown:
    Desc: Reset player's crate open cooldown.
    Done: <#ADD8E6>Reset <#FFC0CB>%player_name%</#FFC0CB>'s open cooldown for <#FFC0CB>%crate_name%</#FFC0CB>.</#ADD8E6>
  Menu:
    Desc: Open crate menu.
    Done:
      Others: <#ADD8E6>Opened crates menu for <#FFC0CB>%player_display_name%</#FFC0CB>.</#ADD8E6>
Error:
  Command:
    Argument:
      InvalidCrate: <#ADD8E6><lred>%value%</lred> is not a valid crate!</#ADD8E6>
      InvalidKey: <#ADD8E6><lred>%value%</lred> is not a valid key!</#ADD8E6>
Crate:
  Open:
    Error:
      InventorySpace:
      - <output:"titles:20:80:20"><sound:"minecraft:entity.villager.no;0.8;1.0">
      - <lred><b>Inventory is Full!</b></lred>
      - <#ADD8E6>Clean up inventory to open crates.</#ADD8E6>
      Cooldown:
        Temporary:
        - <output:"titles:20:80:20"><sound:"minecraft:entity.villager.no;0.8;1.0">
        - <lred><b>Crate is on Cooldown!</b></lred>
        - <#ADD8E6>You can open it in <lred>%time%</lred></#ADD8E6>
        OneTimed:
        - <output:"titles:20:80:20"><sound:"minecraft:entity.villager.no;0.8;1.0">
        - <lred><b>Whoops!</b></lred>
        - <#ADD8E6>You already have opened this one-timed crate!</#ADD8E6>
      NoKey:
      - <output:"titles:20:80:20"><sound:"minecraft:entity.villager.no;0.8;1.0">
      - <lred><b>Whoops!</b></lred>
      - <#ADD8E6>You don't have a key for this crate!</#ADD8E6>
      NoHoldKey:
      - <output:"titles:20:80:20"><sound:"minecraft:entity.villager.no;0.8;1.0">
      - <lred><b>Whoops!</b></lred>
      - <#ADD8E6>You must hold a key to open a crate!</#ADD8E6>
      NoRewards:
      - <output:"titles:20:80:20"><sound:"minecraft:entity.villager.no;0.8;1.0">
      - <red><b>Whoops!</b></red>
      - <#ADD8E6>There are no rewards for you! Try later.</#ADD8E6>
      TooExpensive:
      - <output:"titles:20:80:20"><sound:"minecraft:entity.villager.no;0.8;1.0">
      - <lred><b>Whoops!</b></lred>
      - <#ADD8E6>You need <lred>%crate_open_cost%</lred> to open it!</#ADD8E6>
      Already:
      - <output:"titles:20:80:20"><sound:"minecraft:entity.villager.no;0.8;1.0">
      - <red><b>Whoops!</b></red>
      - <#ADD8E6>You're already opening a crate!</#ADD8E6>
    Reward:
      Info:
      - <noprefix>
      - <#ADD8E6>You won <#FFC0CB>%reward_name%</#FFC0CB> from the <#FFC0CB>%crate_name%</#FFC0CB>!</#ADD8E6>
      Broadcast:
      - <noprefix><sound:"minecraft:block.note_block.bell;0.8;1.0">
      - ' '
      - <gray><lpurple>%player_display_name%</lpurple> opened <lpurple>%crate_name%</lpurple> and received <lpurple>%reward_name%</lpurple>!</gray>
      - ' '
      - '<gray>Purchase keys: <click:open_url:"https://spigotmc.org/"><lpurple>[Click to open Store]</lpurple></click></gray>'
      - ' '
    Milestone:
      Completed:
      - <noprefix>
      - <sound:"minecraft:entity.player.levelup;0.8;1.0">
      - <#ADD8E6>You completed <#FFC0CB>%milestone_openings% Openings </#FFC0CB>milestone and got <#FFC0CB>%reward_name%</#FFC0CB> as reward!</#ADD8E6>
  Preview:
    Error:
      Cooldown: <#ADD8E6>You can preview this crate again in <lred>%time%</lred></#ADD8E6>
  Create:
    Error:
      Duplicated: <lred>Crate with such ID already exists!</lred>
Key:
  Create:
    Error:
      Duplicated: <lred>Key with such ID already exists!</lred>
Other:
  Cooldown:
    Ready: <#FFC0CB>Ready to Open!</#FFC0CB>
  LastOpener:
    Empty: '-'
  LastReward:
    Empty: '-'
  NextMilestone:
    Empty: '-'
  Midnight: Midnight
  Free: Free
  BrokenItem:
    Name: <lred><b>< Invalid Item ></b></lred>
    Description:
    - <#ADD8E6>This item wasn't parsed properly.</#ADD8E6>
    - <#ADD8E6>Check console logs for details.</#ADD8E6>
    Formatted: false
Inspection:
  Problems: '%amount% problem(s)'
  NoProblems: No problems found
