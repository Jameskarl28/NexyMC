      AnimationConfig: <#ADD8E6>Enter <#FFC0CB>[Animation Name]</#FFC0CB></#ADD8E6>
      PreviewConfig: <#ADD8E6>Enter <#FFC0CB>[Preview Name]</#FFC0CB></#ADD8E6>
      Currency: <#ADD8E6>Enter <#FFC0CB>[Currency ID]</#FFC0CB></#ADD8E6>
  Reward:
    Enter:
      Chance: <#ADD8E6>Enter <#FFC0CB>[Weight]</#FFC0CB></#ADD8E6>
      Command: <#ADD8E6>Enter <#FFC0CB>[Command]</#FFC0CB></#ADD8E6>
      Id: <#ADD8E6>Enter <#FFC0CB>[Reward Identifier]</#FFC0CB></#ADD8E6>
      Rarity: <#ADD8E6>Enter <#FFC0CB>[Rarity]</#FFC0CB></#ADD8E6>
      Permissions: <#ADD8E6>Enter <#FFC0CB>[Permission Node]</#FFC0CB></#ADD8E6>
  Button:
    Crate:
      ItemStackable:
        Name: Item Stackable
        Description:
        - Controls whether crate item is stackable.
        Formatted: true
        CurrentInfo:
          Current: '%crate_item_stackable%'
        ClickActions:
          LEFT: toggle
    Key:
      ItemStackable:
        Name: Item Stackable
        Description:
        - Controls whether key item is stackable.
        Formatted: true
        CurrentInfo:
          Current: '%key_item_stackable%'
        ClickActions:
          LEFT: toggle
    Reward:
      SortMode:
        Name: '%mode%'
        Description:
        - Sort reward by their <#FFC0CB>%mode%</#FFC0CB>.
        Formatted: true
        ClickActions:
          LEFT: ascending
          RIGHT: descending
    ItemType:
      ByNBT:
        Name: By Pure NBT
        Description:
        - Saves item by its NBT data.
        - ''
        - <gray><green>✔</green> Saves the whole item NBT data</gray>
        - <gray>compatible with newer MC versions.</gray>
        - ''
        - <gray><red>✘</red> Does <red>not</red> reflect any changes made</gray>
        - <gray>in its original plugin's configuration.</gray>
        Formatted: true
        ClickActions:
          LEFT: select
      ByID:
        Name: By Item ID
        Description:
        - Saves item by its unique ID.
        - ''
        - <gray><green>✔</green> Always reflects all changes made</gray>
        - <gray>in its original plugin's configuration.</gray>
        - ''
        - <gray><red>✘</red> Does <red>not</red> saves any NBT data</gray>
        - <gray>added outside of the item configuration.</gray>
        Formatted: true
        ClickActions:
          LEFT: select
  Item:
    Crates:
      Name: <#FFC0CB><b>Crates</b></#FFC0CB>
      Lore:
      - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>navigate</#FFC0CB>.</#ADD8E6>
    Keys:
      Name: <#FFC0CB><b>Keys</b></#FFC0CB>
      Lore:
      - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>navigate</#FFC0CB>.</#ADD8E6>
    Crate:
      Object:
        Name: '%crate_name%'
        Description:
        - '%inspection_problems%'
        Formatted: true
        CurrentInfo:
          ID: '%crate_id%'
        ClickActions:
          LEFT: navigate
      Create:
        Name: <#FFC0CB><b>New Crate</b></#FFC0CB>
        Lore: []
      Delete:
        Name: <red><b>Delete Crate</b></red>
        Description:
        - <gray>Permanently deletes the crate.</gray>
        Formatted: false
        ClickActions:
          LEFT: delete
      DisplayName:
        Name: Name
        Description:
        - Sets crate name.
        Formatted: true
        CurrentInfo:
          Current: '%crate_name%'
        ClickActions:
          LEFT: change
      Description:
        Name: Description
        Description:
        - '%crate_description%'
        - ''
        - Sets crate description (item lore).
        Formatted: true
        ClickActions:
          LEFT: add line
          RIGHT: remove all
      InventoryStack:
        Name: Inventory Item
        Description:
        - '%inspection_crate_item%'
        - ''
        - Sets item for this crate.
        Formatted: true
        ClickActions:
          LEFT: get item
          DRAG_N_DROP: replace
          RIGHT: get raw copy
      Permission:
        Name: Permission Requirement
        Description:
        - Controls whether permission is
        - required to open this crate.
        Formatted: true
        CurrentInfo:
          Enabled: '%crate_permission_required%'
          Permission: '%crate_permission%'
        ClickActions:
          LEFT: toggle
      OpenCooldown:
        Name: Open Cooldown
        Description:
        - Sets per player cooldown
        - for crate openings.
        Formatted: true
        CurrentInfo:
          Cooldown: '%crate_open_cooldown%'
        ClickActions:
          LEFT: set cooldown
          DROP_KEY: make one-timed
          RIGHT: remove
      Preview:
        Name: Preview
        Description:
        - '%inspection_crate_preview%'
        - ''
        - Sets preview GUI for this crate.
        Formatted: true
        CurrentInfo:
          Enabled: '%crate_preview_enabled%'
          Id: '%crate_preview_id%'
        ClickActions:
          LEFT: change ID
          RIGHT: toggle
      Animation:
        Name: Opening
        Description:
        - '%inspection_crate_animation%'
        - ''
        - Sets opening animation for this crate.
        Formatted: true
        CurrentInfo:
          Enabled: '%crate_animation_enabled%'
          Id: '%crate_animation_id%'
        ClickActions:
          LEFT: change ID
          RIGHT: toggle
      KeyRequirement:
        Name: Key Requirements
        Description:
        - '%inspection_crate_key_requirement%'
        - ''
        - '%crate_key_ids%'
        - ''
        - Player must have certain keys
        - to open this crate.
        Formatted: true
        CurrentInfo:
          Enabled: '%crate_key_required%'
          Keys: ''
        ClickActions:
          LEFT: add key
          DROP_KEY: toggle requirement
          RIGHT: remove all
      OpenCost:
        Name: Open Cost
        Description:
        - '%inspection_crate_open_cost%'
        - Player have to pay certain currencies
        - to open this crate.
        Formatted: true
        ClickActions:
          LEFT: navigate
        Object:
          Name: <#FFC0CB><b>%name%</b></#FFC0CB>
          Lore:
          - '<#FFC0CB>● <#ADD8E6>Currency ID: </#ADD8E6>%id%</#FFC0CB>'
          - '<#FFC0CB>● <#ADD8E6>Amount: </#ADD8E6>%amount%</#FFC0CB>'
          - ''
          - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Left-Click to <#FFC0CB>change amount</#FFC0CB>.</#ADD8E6>
          - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Right-Click to <#FFC0CB>remove</#FFC0CB>.</#ADD8E6>
        Create:
          Name: <#FFC0CB><b>Add Cost</b></#FFC0CB>
          Lore: []
      Placement:
        Info:
          Name: Placement
          Description:
          - Place crate anywhere in the world
          - with particle effects and hologram!
          Formatted: true
          ClickActions:
            LEFT: navigate
        Locations:
          Name: <#FFC0CB><b>Assigned Blocks</b></#FFC0CB>
          Lore:
          - <#ADD8E6>%crate_locations%</#ADD8E6>
          - ''
          - <#ADD8E6>Clicking an assigned block will</#ADD8E6>
          - <#ADD8E6>preview or open a crate.</#ADD8E6>
          - ''
          - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Left-Click to <#FFC0CB>assign block</#FFC0CB>.</#ADD8E6>
          - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Right-Click to <#FFC0CB>remove all</#FFC0CB>.</#ADD8E6>
        Pushback:
          Name: <#FFC0CB><b>Block Pushback</b></#FFC0CB>
          Lore:
          - '<#FFC0CB>● <#ADD8E6>Status: </#ADD8E6>%crate_pushback_enabled%</#FFC0CB>'
          - ''
          - <#ADD8E6>Pushes players back from the crate</#ADD8E6>
          - <#ADD8E6>if they don't met the requirements.</#ADD8E6>
          - ''
          - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>toggle</#FFC0CB>.</#ADD8E6>
        HologramToggle:
          Name: <#FFC0CB><b>Hologram State</b></#FFC0CB>
          Lore:
          - '<#FFC0CB>● <#ADD8E6>Enabled: </#ADD8E6>%crate_hologram_enabled%</#FFC0CB>'
          - ''
          - <#ADD8E6>Enables a hologram above crate block(s).</#ADD8E6>
          - ''
          - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>toggle</#FFC0CB>.</#ADD8E6>
        HologramTemplate:
          Name: <#FFC0CB><b>Hologram Template</b></#FFC0CB>
          Lore:
          - '%inspection_crate_hologram%'
          - ''
          - '<#FFC0CB>● <#ADD8E6>Current: </#ADD8E6>%crate_hologram_template%</#FFC0CB>'
          - ''
          - <#ADD8E6>Hologram text depends on</#ADD8E6>
          - <#ADD8E6>selected hologram template.</#ADD8E6>
          - ''
          - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>change</#FFC0CB>.</#ADD8E6>
        HologramYOffset:
          Name: <#FFC0CB><b>Hologram Y Offset</b></#FFC0CB>
          Lore:
          - '<#FFC0CB>● <#ADD8E6>Current: </#ADD8E6>%crate_hologram_y_offset%</#FFC0CB>'
          - ''
          - <#ADD8E6>Offsets a hologram by Y</#ADD8E6>
          - <#ADD8E6>axis by defined value.</#ADD8E6>
          - ''
          - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>change</#FFC0CB>.</#ADD8E6>
        Effect:
          Model:
            Name: <#FFC0CB><b>Effect Model</b></#FFC0CB>
            Lore:
            - '<#FFC0CB>● <#ADD8E6>Current: </#ADD8E6>%crate_effect_model%</#FFC0CB>'
            - ''
            - <#ADD8E6>Sets effect model or</#ADD8E6>
            - <#ADD8E6>disables the effects.</#ADD8E6>
            - ''
            - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Left-Click to <#FFC0CB>change</#FFC0CB>.</#ADD8E6>
            - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Right-Click to <#FFC0CB>disable</#FFC0CB>.</#ADD8E6>
          Particle:
            Name: <#FFC0CB><b>Effect Particle</b></#FFC0CB>
            Lore:
            - '<#FFC0CB>● <#ADD8E6>Current: </#ADD8E6>%crate_effect_particle_name%</#FFC0CB>'
            - ''
            - <#ADD8E6>Sets effect particles.</#ADD8E6>
            - ''
            - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>change</#FFC0CB>.</#ADD8E6>
          ParticleData:
            Name: <#FFC0CB><b>Particle Data</b></#FFC0CB>
            Lore:
            - '%inspection_crate_particle_data%'
            - ''
            - <#ADD8E6>Sets particle options.</#ADD8E6>
            - ''
            - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>edit</#FFC0CB>.</#ADD8E6>
      Particle:
        Data:
          Red:
            Name: <#FFC0CB><b>Red</b></#FFC0CB>
            Lore:
            - '<#FFC0CB>● <#ADD8E6>Current: </#ADD8E6>%value%</#FFC0CB>'
            - ''
            - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>change</#FFC0CB>.</#ADD8E6>
          Green:
            Name: <#FFC0CB><b>Green</b></#FFC0CB>
            Lore:
            - '<#FFC0CB>● <#ADD8E6>Current: </#ADD8E6>%value%</#FFC0CB>'
            - ''
            - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>change</#FFC0CB>.</#ADD8E6>
          Blue:
            Name: <#FFC0CB><b>Blue</b></#FFC0CB>
            Lore:
            - '<#FFC0CB>● <#ADD8E6>Current: </#ADD8E6>%value%</#FFC0CB>'
            - ''
            - <#FFC0CB>[▶]</#FFC0CB> <#ADD8E6>Click to <#FFC0CB>change</#FFC0CB>.</#ADD8E6>
          Size:
