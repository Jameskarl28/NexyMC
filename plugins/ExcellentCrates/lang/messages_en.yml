    Amount: <#ADD8E6>Enter <#FFC0CB>[Amount]</#FFC0CB></#ADD8E6>
    Value: <#ADD8E6>Enter <#FFC0CB>[Value]</#FFC0CB></#ADD8E6>
  Crate:
    Enter:
