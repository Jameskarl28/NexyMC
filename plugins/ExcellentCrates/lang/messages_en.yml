      Id: <#ADD8E6>Enter <#FFC0CB>[Crate Identifier]</#FFC0CB></#ADD8E6>
      ModelName: <#ADD8E6>Enter <#FFC0CB>[Model Name]</#FFC0CB></#ADD8E6>
      Particle:
