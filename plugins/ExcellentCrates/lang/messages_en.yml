      KeyId: <#ADD8E6>Enter <#FFC0CB>[Key Identifier]</#FFC0CB></#ADD8E6>
      BlockLocation: <#ADD8E6>Click a <#FFC0CB>[Block] </#FFC0CB> to assign crate.</#ADD8E6>
