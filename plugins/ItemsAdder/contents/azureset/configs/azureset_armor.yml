armors_rendering:
  azurearmor:
    color: '#274d9a'
    layer_1: armor/azure_armor_layer_1
    layer_2: armor/azure_armor_layer_2
    use_color: false
info:
  namespace: azureset
items:
  azureboots:
    display_name: <color:#4086BB>・Azure Boots・
    permission: azure.boots
    resource:
      generate: true
      textures:
      - armor/azure_boots_icon.png
    enchants:
      - PROTECTION:8
      - UNBREAKING:5
      - MENDING
    lore:
      - ''
      - '<color:#6BE1FF>ꜱᴇᴀꜱᴏɴ ɪɪɪ'
      - 'ㆉ'
      - 'ㆃ'
    durability:
