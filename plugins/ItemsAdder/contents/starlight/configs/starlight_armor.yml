    display_name: <#F1BA22>・Starlight Helmet・
    permission: starlight.helmet
    resource:
      generate: true
      textures:
      - armor/starlight_helmet_icon.png
    enchants:
      - PROTECTION:4
      - UNBREAKING:3
      - MENDING
    lore:
      - ''
      - '<#F1BA22>The Starlight was forged from fallen stardust glowing'
      - '<#F1BA22>with the light of distant galaxies. Those who wear it'
      - '<#F1BA22>carry a fragment of the cosmos upon their back.'
      - ''
    durability:
