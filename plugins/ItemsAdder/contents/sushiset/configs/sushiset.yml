    display_name: <#F24E26>・Sushi Axe・
    permission: sushiset.axe
    resource:
      material: NETHERITE_AXE
      generate: false
      model_path: axe
    enchants:
      - MENDING
      - UNBREAKING:3
      - SHARPNESS:5
    lore:
      - ''
      - '<#F24E26>The Sushi Set was forged by warrior-chefs, imbuing every'
      - '<#F24E26>blade, armor, and tool with the spirit of the sea. Each'
      - '<#F24E26>movement is as sharp and fluid as slicing fresh sashimi.'
