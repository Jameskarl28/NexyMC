items:
  valentine_axe:
    display_name: <#FFD3D5>・Roselight Axe・
    permission: valentine.axe
    resource:
      generate: false
      material: NETHERITE_AXE
      model_path: axe
    enchants:
      - MENDING
      - UNBREAKING:3
      - SHARPNESS:5
    lore:
      - ''
      - '<#FFD3D5>The Roselight shines with a warm, rosy glow, from its weapons'
      - '<#FFD3D5>and tools to its armor, helmet, and wings. Each piece radiates'
      - '<#FFD3D5>gentle brilliance, turning sweetness into strength.'
    durability:
      unbreakable: true

