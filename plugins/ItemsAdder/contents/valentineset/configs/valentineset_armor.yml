armors_rendering:
  valentinearmor:
    color: '#ffd1d5'
    layer_1: armor/valentine_armor_layer_1
    layer_2: armor/valentine_armor_layer_2
    use_color: false
info:
  namespace: valentineset
items:
  valentineboots:
    display_name: <gradient:#FFD3D5:#FFD3D5>・Roselight Boots・
    permission: valentine.boots
    resource:
      generate: true
      textures:
      - armor/valentine_boots_icon.png
    specific_properties:
      armor:
        custom_armor: valentinearmor
        slot: feet
    enchants:
      - PROTECTION:4
      - UNBREAKING:3
      - MENDING
    lore:
      - ''
      - '<#FFD3D5>The Roselight shines with a warm, rosy glow, from its weapons'
      - '<#FFD3D5>and tools to its armor, helmet, and wings. Each piece radiates'
      - '<#FFD3D5>gentle brilliance, turning sweetness into strength.'
      - ''
    durability:
      max_custom_durability: 1000
    attribute_modifiers:
      feet:
        armor: 4
        armorToughness: 4
        KnockbackResistance: 0.1
        
        
