nexiesTocopper:
  rank: 'default'
  next: 'sprinkle1'
  requirements:
    - 'playtime-minutes 50'
    - 'money 1000'
    - 'block-break STONE 50'
    - 'block-break DIRT 30'
    - 'mob-kills ZOMBIE 10'
    - 'mob-kills SKELETON 10'
    - 'advancement husbandry/plant_seed'
  rankup:
    requirements-not-met: |
      &dRequirements to rankup from &7&lNexies &dto &6&lSprinkle 1
      &6Playtime:
        &c{{rank.requirement('playtime-minutes').done ? '&a' : '&c'}} %rankup_requirement_playtime-minutes_done% minutes / %rankup_requirement_playtime-minutes% minutes
      &6Money:
        &c{{rank.requirement('money').done ? '&a' : '&c'}}₱%rankup_requirement_money_done% / ₱%rankup_requirement_money%
      &eBlock Breaks:
        &c{{rank.requirement('block-break#STONE').done ? '&a' : '&c'}}{{ rank.requirement('block-break#STONE').progress | money}} / {{ rank.requirement('block-break#STONE').total | money }} Stone
        &c{{rank.requirement('block-break#DIRT').done ? '&a' : '&c'}}{{ rank.requirement('block-break#DIRT').progress | money}} / {{ rank.requirement('block-break#DIRT').total | money }} Dirt  
      &eMob Kills:
        &c{{rank.requirement('mob-kills#ZOMBIE').done ? '&a' : '&c'}}{{ rank.requirement('mob-kills#ZOMBIE').progress | money}} / {{ rank.requirement('mob-kills#ZOMBIE').total | money }} Zombie
        &c{{rank.requirement('mob-kills#SKELETON').done ? '&a' : '&c'}}{{ rank.requirement('mob-kills#SKELETON').progress | money}} / {{ rank.requirement('mob-kills#SKELETON').total | money }} Skeleton
      &5Advancement:
        &fComplete the "&e&l&nA Seedy Place&f"
  gui:
   rows: 4
   rankup:
    material: LIME_STAINED_GLASS_PANE
    index: 10-12 19-21
    name: '&a&lᴄᴏɴꜰɪʀᴍ'
    lore: '&6ᴀʀᴇ ʏᴏᴜ ꜱᴜʀᴇ ᴛᴏ ʀᴀɴᴋᴜᴘ ᴛᴏ &6{RANK}'
  cancel:
    material: RED_STAINED_GLASS_PANE
    index: 14-16 23-25
    name: '&6&lᴄᴀɴᴄᴇʟ'
  fill:
    name: ' '
    material: BLACK_STAINED_GLASS_PANE
  commands:
    - 'say {PLAYER} ranked up to {RANK} at %world_time_world% in world: %world_name_world%'
    - 'execute at {PLAYER} run playsound minecraft:ui.toast.challenge_complete player {PLAYER} ~ ~ ~'
    - 'execute at {PLAYER} run particle minecraft:firework ~ ~1 ~ 1 1 1 0 30 normal'
    - 'title {PLAYER} subtitle {"text":"Congratulations","bold":true,"color":"yellow"}'
    - 'title {PLAYER} title {"text":"Rankup &fち","bold":true,"color":"gold"}'
