  - "&7[ᴡᴇʟᴄᴏᴍᴇ] &#7289da[ᴅɪꜱᴄᴏʀᴅ]&7 [ᴠᴏᴛᴇ]"
  - "&7[ᴡᴇʟᴄᴏᴍᴇ] [ᴅɪꜱᴄᴏʀᴅ] &a[ᴠᴏᴛᴇ]"
2:
  change-interval: 2500
  texts:
  - '&fᴡᴇʟᴄᴏᴍᴇ ᴛᴏ ᴏʀɪᴏɴᴍᴄ ʏᴏᴜ ᴀʀᴇ'   
  - '&fᴊᴏɪɴ ᴏᴜʀ ᴏꜰꜰɪᴄɪᴀʟ ᴅɪꜱᴄᴏʀᴅ ᴄᴏᴍᴍᴜɴɪᴛʏ ꜰᴏʀ ᴜᴘᴅᴀᴛᴇꜱ,' 
  - '&fɢᴇᴛ ꜰʀᴇᴇ ʀᴇᴡᴀʀᴅꜱ ʙʏ ꜱᴜᴘᴘᴏʀᴛɪɴɢ ᴏʀɪᴏɴᴍᴄ'
3:
  change-interval: 2500
  texts:
  - '&fᴄᴜʀʀᴇɴᴛʟʏ ᴘʟᴀʏɪɴɢ ᴏɴ ᴏʀɪᴏɴᴍᴄ ꜱᴇʀᴠᴇʀ!'
  - '&fᴛʜʀᴏᴜɢʜ ᴠᴏᴛɪɴɢ ꜰᴏʀ ᴛʜᴇ ꜱᴇʀᴠᴇʀ ᴜꜱɪɴɢ /ᴠᴏᴛᴇ!'
  - '&fɢɪᴠᴇᴀᴡᴀʏꜱ, ᴀɴɴᴏᴜɴᴄᴇᴍᴇɴᴛꜱ ᴀɴᴅ ᴍᴀɴʏ ᴍᴏʀᴇ!'
