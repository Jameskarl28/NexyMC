header-footer:
  enabled: true
  designs:
    world-world1:
      display-condition: '%world%=world1'
      header:
      - an example of world with custom
      footer:
      - header/footer and prefix/suffix
    world-world2;world3:
      display-condition: '%world%=world2|%world%=world3'
      header:
      - This is a shared header for
      - world2 and world3
      footer: []
    server-server1:
      display-condition: '%server%=server1'
      header:
      - an example of server with custom header
      footer: []
    default:
      display-condition: '%world%!=disabledworld'
      header:
      - 
      - ''
      - ''
      - ''
      - ''
      - ''
      - ''
      - ''
      - ''
      - '#ADD8E6Online&r&7: &f%server_online%   #ADD8E6Ping&7: &f%player_colored_ping%   #ADD8E6TPS&7: &f%server_tps_1_colored%'
      - ''
      footer:
      - ''
      - ''
      - ''
      - '%animation:4%'
      - ''
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:gandalang,owner,developer,admin,event,builder,moderator,helper,builder,streamer,seraph,celestia,starlie3,starlie2,starlie1,sparkle3,sparkle2,sparkle1,twinkle3,twinkle2,twinkle1,glitter3,glitter2,glitter1,puffy3,puffy2,puffy1,sprinkle3,sprinkle2,sprinkle1,default
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'
playerlist-objective:
  enabled: false
  value: '%ping%'
  fancy-value: '%betterteams_color%%betterteams_name%'
  title: TAB
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'
belowname-objective:
  enabled: true
  value: '%health%'
  title: ''
  fancy-value: '&r#FFC0CB%vault_eco_balance_formatted% &7| &r#FFC0CB%playerpoints_points_formatted% &7| &r#FFC0CB%statistic_player_kills% &7| &r#FFC0CB%statistic_deaths%'
  fancy-value-default: NPC
  disable-condition: '%world%=disabledworld'
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: PROGRESS
      color: '%animation:barcolors%'
      progress: '100'
      text: '#FFC0CB&lBUILD BATTLE! PLEASE CHECK ANNOUNCEMENT FOR DETAILS'
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  use-numbers: true
  static-number: 0
  delay-on-join-milliseconds: 0
  scoreboards:
    java:
      title: 
      display-condition: '%bedrock%=false'
      lines:
      - ''
      #- '#FFC0CB&lProfile'
      - '&r #ADD8E6Rank: %luckperms_prefix%'
      - '&r #ADD8E6Claims: #FFC0CB%griefprevention_remainingclaims_formatted%'
      - '&r #ADD8E6Balance: #FFC0CB%vault_eco_balance_formatted%'
      #- '&fδ #ADD8E6Stars: #FFC0CB%playerpoints_points_formatted%'
      #- '&fξ #ADD8E6Jobs: #FFC0CB%jobsr_user_joinedjobcount%&8/#FFC0CB%jobsr_maxjobs%'
      #- ''
      - '&r #ADD8E6Pinata: #FFC0CB%pinataparty_current_votes%&7/#FFC0CB%pinataparty_votes_needed%'
      - ''
      #- '&fβ #ADD8E6Claimed:'
      #- '#FFC0CB%griefprevention_currentclaim_ownername%'
      #- ''
      #- '&fς #ADD8E6Team:'
      #- ' %betterteams_color%%betterteams_name%'
      #- ''
      #- '   #FFC0CB/sb to disable'
    bedrock:
      title: '&#FFC0CB&lNEXYMC'
      lines:
      - '&fRank: &r%luckperms_prefix%'
      #- '&fTeam: &r%betterteams_displayname%'
      - '&fMoney: &a%cmi_user_balance_formated%'
      - '&fClaim: &e%griefprevention_remainingclaims%'
      #- '&fLand: &b%griefprevention_currentclaim_ownername%'
      - '&fPinata: &f%pinataparty_current_votes% / %pinataparty_votes_needed%'
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:383747683
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    default:
      fixed-slots:
      - '1|&3Website&f:'
      - 2|&bmyserver.net
      - '3|&8&m                       '
      - '4|&3Name&f:'
      - 5|&b%player%
      - '7|&3Rank&f:'
      - '8|Rank: %group%'
      - '10|&3World&f:'
      - 11|&b%world%
      - '13|&3Time&f:'
      - 14|&b%time%
      - '21|&3Teamspeak&f:'
      - 22|&bts.myserver.net
      - '23|&8&m                       '
      - '41|&3Store&f:'
      - 42|&bshop.myserver.net
      - '43|&8&m                       '
      groups:
        staff:
          condition: permission:tab.staff
          slots:
          - 24-40
        players:
          slots:
          - 44-80
ping-spoof:
  enabled: false
  value: 0
placeholders:
  date-format: dd.MM.yyyy
  time-format: '[HH:mm:ss / h:mm a]'
  time-offset: 0
  register-tab-expansion: false
placeholder-output-replacements:
  '%essentials_vanished%':
    'yes': '&7| Vanished'
    'no': ''
conditions:
  nick:
    conditions:
    - '%player%=%essentials_nickname%'
    true: '%player%'
    false: ~%essentials_nickname%
placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%server_uptime%': 1000
  '%server_tps_1_colored%': 1000
  '%server_unique_joins%': 5000
  '%player_health%': 200
  '%player_ping%': 1000
  '%vault_prefix%': 1000
  '%rel_factionsuuid_relation_color%': 1000
assign-groups-by-permissions: false
primary-group-finding-list:
- Owner
- Admin
- Mod
- Helper
- default
permission-refresh-interval: 1000
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
  useSSL: true
proxy-support:
  enabled: true
  type: PLUGIN
  plugin:
    name: RedisBungee
  redis:
    url: redis://:password@localhost:6379/0
  rabbitmq:
    exchange: plugin
    url: amqp://guest:guest@localhost:5672/%2F
per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds:
  - ignoredworld
  - build
  shared-playerlist-world-groups:
    lobby:
    - lobby1
    - lobby2
    minigames:
    - paintball
    - bedwars
compensate-for-packetevents-bug: false
global-playerlist:
  enabled: false
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers:
  - spyserver1
  - spyserver2
  server-groups:
    lobbies:
    - lobby1
    - lobby2
    group2:
    - server1
    - server2
use-bukkit-permissions-manager: false
use-online-uuid-in-tablist: true
config-version: 2
components:
  minimessage-support: true
  disable-shadow-for-heads: true
